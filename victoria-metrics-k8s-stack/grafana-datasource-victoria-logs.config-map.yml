---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-victoria-logs
  namespace: victoria-metrics-k8s-stack
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-single-server.victoria-logs.svc.cluster.local:9248
        isDefault: false
        isEditable: true
...
