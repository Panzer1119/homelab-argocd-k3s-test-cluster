---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
  namespace: csi-proxmox
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-connect
  target:
    name: proxmox-csi-config
    template:
      engineVersion: v2
      data:
        "config.yaml": |
          ---
          clusters:
            - url: "{{ .proxmox_url }}"
              insecure: {{ .proxmox_insecure }}
              token_id: "{{ .proxmox_token_id }}"
              token_secret: "{{ .proxmox_token_secret }}"
              region: "{{ .proxmox_region }}"
              # Native ZFS snapshot mode (opt-in per cluster)
              enable_zfs_snapshots: true
              # SSH access for native ZFS snapshots
              ssh_port: {{ default 22 .proxmox_ssh_port }}
              ssh_user: "{{ default "root" .proxmox_ssh_user }}"
              ssh_use_sudo: {{ default false .proxmox_ssh_use_sudo }}
              ssh_private_key_secret_ref:
                namespace: "csi-proxmox"
                name: "proxmox-csi-config"
                key: "ssh_private_key"
              node_ssh_options:
                pve-1:
                  host: "{{ default .proxmox_url .proxmox_pve_1_host }}"
          
          ## Deploy Node CSI driver only on proxmox nodes
          #node:
          #  nodeSelector:
          #    # It will work only with Talos CCM, remove it overwise
          #    node.cloudprovider.kubernetes.io/platform: nocloud
          #  tolerations:
          #    - operator: Exists
          
          # Controller node scheduling
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          ...
        ssh_private_key: |
          -----BEGIN OPENSSH PRIVATE KEY-----
          {{ .proxmox_ssh_private_key }}
          -----END OPENSSH PRIVATE KEY-----
  data:
    - secretKey: proxmox_url
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "URL"
    - secretKey: proxmox_insecure
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Insecure"
    - secretKey: proxmox_token_id
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Benutzername"
    - secretKey: proxmox_token_secret
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Anmeldedaten"
    - secretKey: proxmox_region
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Region"
    - secretKey: proxmox_ssh_port
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "SSH - Port"
    - secretKey: proxmox_ssh_user
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "SSH - Username"
    - secretKey: proxmox_ssh_use_sudo
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "SSH - Use sudo"
    - secretKey: proxmox_ssh_private_key
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "SSH - Private Key"
    - secretKey: proxmox_pve_1_host
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "PVE-1 - Host"
...
