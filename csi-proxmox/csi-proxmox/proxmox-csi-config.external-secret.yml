---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
  namespace: csi-proxmox
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-connect
  target:
    name: proxmox-csi-config
    template:
      engineVersion: v2
      data:
        "config.yaml": |
          ---
          clusters:
            - url: "{{ .proxmox_url }}"
              insecure: {{ .proxmox_insecure }}
              token_id: "{{ .proxmox_token_id }}"
              token_secret: "{{ .proxmox_token_secret }}"
              region: "{{ .proxmox_region }}"
          
          ## Deploy Node CSI driver only on proxmox nodes
          #node:
          #  nodeSelector:
          #    # It will work only with Talos CCM, remove it overwise
          #    node.cloudprovider.kubernetes.io/platform: nocloud
          #  tolerations:
          #    - operator: Exists
          
          # Controller node scheduling
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          ...
  data:
    - secretKey: proxmox_url
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "URL"
    - secretKey: proxmox_insecure
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Insecure"
    - secretKey: proxmox_token_id
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Benutzername"
    - secretKey: proxmox_token_secret
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Anmeldedaten"
    - secretKey: proxmox_region
      remoteRef:
        key: "Proxmox homelab-cluster kubernetes-csi k3s-test-cluster"
        property: "Region"
...
