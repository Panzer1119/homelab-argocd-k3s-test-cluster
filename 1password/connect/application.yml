---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password-connect
  namespace: argocd
spec:
  project: default
  source:
    chart: connect
    repoURL: https://1password.github.io/connect-helm-charts
    targetRevision: 2.4.1
    helm:
      valuesObject:
        connect:
          create: true
          replicas: 1
          ingress:
            enabled: true
        operator:
          create: true
          replicas: 1
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 1password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
...
