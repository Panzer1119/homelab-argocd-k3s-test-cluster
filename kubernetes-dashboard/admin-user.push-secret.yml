---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
spec:
  deletionPolicy: Delete
  refreshInterval: 10m
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: 1password-connect
  selector:
    secret:
      name: admin-user
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: "homelab-argocd-k3s-test-cluster - kubernetes-dashboard - admin-user"
          property: "password"
...
