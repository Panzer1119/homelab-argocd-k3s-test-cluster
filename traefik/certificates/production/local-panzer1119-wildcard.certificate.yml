---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-panzer1119-wildcard
  namespace: traefik
spec:
  secretName: local-panzer1119-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - "local.panzer1119.de"
    - "local.panzer1119.eu"
    - "*.local.panzer1119.de"
    - "*.local.panzer1119.eu"
    - "*.argocd-mbp-test.local.panzer1119.de"
    - "*.argocd-k3s-test.local.panzer1119.eu"
...
