---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: v38.0.1
    helm:
      valuesObject:
        deployment:
          enabled: true
          replicas: 3
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
          minAvailable: 1
        ingressRoute:
          dashboard:
            enabled: true
            entryPoints: [ traefik, websecure ]
            matchRule: Host(`traefik-dashboard.argocd-k3s-test.local.panzer1119.de`)
          healthcheck:
            enabled: true
            entryPoints: [ traefik, websecure ]
            matchRule: Host(`traefik-status.argocd-k3s-test.local.panzer1119.de`)
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
            observability:
              accessLogs: false
              metrics: false
              tracing: false
          websecure:
            tls:
              enabled: true
        #        providers:
        #          kubernetesCRD:
        #            enabled: true
        #            ingressClass: "traefik-external"
        #            allowCrossNamespace: true
        #          kubernetesIngress:
        #            enabled: true
        #            publishedService:
        #              enabled: false
        service:
          enabled: true
          spec:
            loadBalancerIP: "192.168.7.21"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
...
