---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: v38.0.1
    helm:
      valuesObject:
        deployment:
          enabled: true
          replicas: 2
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
            observability:
              accessLogs: false
              metrics: false
              tracing: false
#        providers:
#          kubernetesCRD:
#            enabled: true
#            ingressClass: "traefik-external"
#            allowCrossNamespace: true
#          kubernetesIngress:
#            enabled: true
#            publishedService:
#              enabled: false
        service:
          enabled: true
          spec:
            loadBalancerIP: "192.168.7.21"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
...
