---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi
  namespace: argocd
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.21.1
    helm:
      valuesObject:
        fullnameOverride: external-dns-unifi
        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/home-operations/external-dns-unifi-webhook
              tag: 0.10.2
            livenessProbe:
              httpGet:
                path: /healthz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /readyz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
            env:
              - name: UNIFI_HOST
                valueFrom:
                  secretKeyRef:
                    name: unifi-configuration
                    key: UNIFI_HOST
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: unifi-configuration
                    key: UNIFI_API_KEY
              - name: LOG_LEVEL
                value: debug
        triggerLoopOnEvent: true
        policy: sync
        #sources:
        #  - gateway-httproute
        #  - service
        txtOwnerId: test
        txtPrefix: k3s.test.%{record_type}-
        domainFilters:
          - argocd-k3s-test.panzer1119.de
        #serviceMonitor:
        #  enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
...
