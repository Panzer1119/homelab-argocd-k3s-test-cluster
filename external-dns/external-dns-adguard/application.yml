---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-adguard
  namespace: argocd
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.21.1
    helm:
      valuesObject:
        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/muhlba91/external-dns-provider-adguard
              tag: v11.1.1
            service:
              port: 8888
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5
            env:
              - name: ADGUARD_URL
                valueFrom:
                  secretKeyRef:
                    name: adguard-configuration
                    key: url
              - name: ADGUARD_USER
                valueFrom:
                  secretKeyRef:
                    name: adguard-configuration
                    key: user
              - name: ADGUARD_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: adguard-configuration
                    key: password
              - name: LOG_LEVEL
                value: debug
              - name: DRY_RUN
                value: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
...
