---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: "https://argocd.argocd-mbp-test.panzer1119.de"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.argocd-mbp-test.panzer1119.de`)
      middlewares:
        - name: redirect-to-https
          namespace: traefik
        - name: local-only
          namespace: traefik
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.argocd-mbp-test.panzer1119.de`) && Header(`Content-Type`, `application/grpc`)
      middlewares:
        - name: redirect-to-https
          namespace: traefik
        - name: local-only
          namespace: traefik
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
...
