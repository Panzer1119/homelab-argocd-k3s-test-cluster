---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: prowlarr-apikey
  namespace: prowlarr
spec:
  deletionPolicy: Delete
  refreshInterval: 10m0s
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: 1password-connect
  selector:
    secret:
      name: prowlarr-apikey
  data:
    - match:
        secretKey: apiKey
        remoteRef:
          remoteKey: "homelab-argocd-k3s-test-cluster - Prowlarr"
          property: "API Key"
...
