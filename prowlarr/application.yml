---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: "https://prowlarr.argocd-k3s-test.local.panzer1119.de"
spec:
  project: default
  source:
    chart: prowlarr
    repoURL: https://panzer1119.github.io/helm-charts
    targetRevision: 0.4.15
    helm:
      valuesObject:
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia@kubernetescrd
          hosts:
            - host: prowlarr.argocd-k3s-test.local.panzer1119.de
              paths:
                - path: /
                  pathType: ImplementationSpecific
        syncApiKey:
          enabled: true
          pushSecret:
            enabled: true
            secretStoreRefs:
              - kind: ClusterSecretStore
                name: 1password-connect
            remoteRef:
              remoteKey: "homelab-argocd-k3s-test-cluster - Prowlarr"
              property: "API Key"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prowlarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      enabled: false
      prune: true
      selfHeal: true
  ignoreDifferences:
    - kind: Secret
      name: prowlarr-apikey
      namespace: prowlarr
      jsonPointers:
        - /data
...
