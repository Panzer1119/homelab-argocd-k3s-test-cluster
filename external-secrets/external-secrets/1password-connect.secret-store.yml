---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: 1password-connect
spec:
  provider:
    onepassword:
      connectHost: "http://onepassword-connect.1password.svc.cluster.local:8080"
      vaults:
        Kubernetes: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            namespace: 1password
            name: onepassword-token
            key: token
...
