---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: test
spec:
  selector:
    app: whoami
  ports:
    - port: 80
...
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: test
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`whoami.argocd-k3s-test.local.panzer1119.de`)
      kind: Rule
      services:
        - name: whoami
          port: 80
...
