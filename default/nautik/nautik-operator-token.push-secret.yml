---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: nautik-operator-token
  namespace: default
spec:
  deletionPolicy: Delete
  refreshInterval: 10m0s
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: 1password-connect
  selector:
    secret:
      name: nautik-operator-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: "homelab-argocd-k3s-test-cluster - default - nautik-operator"
          property: "password"
...
